name: researchos

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-researchos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}@db:5432/${POSTGRES_DB:-researchos}
  DATABASE_SSL: "false"
  APP_URL: ${APP_URL:-http://localhost:3000}
  NODE_ENV: production

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-researchos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    # No host database port: app, worker and migrate use the private Compose network.

  migrate:
    build:
      context: .
      target: worker
    init: true
    env_file: .env.local
    environment: *runtime-environment
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    env_file: .env.local
    environment: *runtime-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    env_file: .env.local
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
